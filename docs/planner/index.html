<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Скачать Планировщик задач</title><style>body{font:16px sans-serif;background:#f4f5f7}main{max-width:440px;margin:30px auto;background:white;padding:25px;border-radius:12px}input,select,button{box-sizing:border-box;width:100%;padding:12px;margin:8px 0}a{color:#176}p{line-height:1.5}</style><main><h1>Планировщик задач</h1><p>Версия 0.5.0 · работает без Интернета</p><form><select id="type"><option value="pc">Для ПК — файл HTML</option><option value="android">Для Android — APK</option><option value="all">Полный комплект ZIP с инструкциями</option></select><label>Ключ скачивания<input id="key" type="password" required></label><button>Подготовить файл</button></form><p id="msg"></p><a id="save" hidden>Скачать готовый файл</a><p>ПК: откройте скачанный HTML в Chrome или Edge. Android: откройте APK для установки.</p><p>Это тестовая версия. Полная проверка на устройствах ещё требуется. Для обмена задачами через Интернет нужен свой сервер.</p></main><script src="app.js"></script>
